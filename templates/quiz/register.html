{% extends "quiz/base.html" %}
{% block title %}Register - QuizzyPop{% endblock %}

{% block extra_css %}
<style>
    body { display: flex; align-items: center; justify-content: center; }
    .auth-box { width: 100%; max-width: 400px; }
    .auth-box h2 { color: var(--highlight); margin-top: 0; text-align: center; }
    .auth-box p { text-align: center; opacity: 0.8; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-weight: bold; }
    .form-group input {
        width: 100%; padding: 0.8rem;
        border-radius: 6px; border: 2px solid var(--accent);
        background-color: var(--primary); color: var(--text); font-size: 1rem;
    }
    .form-group input:focus { outline: none; border-color: var(--highlight); }
    .submit-row { text-align: center; margin-top: 1.5rem; }
    .submit-row .btn { width: 100%; font-size: 1.1rem; }
    .footer-link { text-align: center; margin-top: 1.2rem; }
    .error-msg { background: #ff4d4d; color: white; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; }
</style>
{% endblock %}

{% block content %}
<div class="auth-box card" style="margin: auto; position: relative; top: 50px;">
    <h2>🎯 QuizzyPop</h2>
    <p>Create your account to start playing!</p>
    <div id="errorMsg" class="error-msg" style="display: none;"></div>
    <form id="registerForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required>
        </div>
        <div class="submit-row">
            <button type="submit" class="btn">Register</button>
        </div>
    </form>
    <div class="footer-link">
        Already have an account? <a href="{% url 'login' %}">Login here</a>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('errorMsg');
        
        try {
            const response = await fetch('/api/v1/register/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                // Auto login after register
                const loginResponse = await fetch('/api/v1/token/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const loginData = await loginResponse.json();
                if (loginResponse.ok) {
                    localStorage.setItem('access_token', loginData.access);
                    localStorage.setItem('refresh_token', loginData.refresh);
                    localStorage.setItem('username', username);
                    window.location.href = "{% url 'index' %}";
                } else {
                    window.location.href = "{% url 'login' %}";
                }
            } else {
                errorDiv.innerText = data.error || 'Registration failed.';
                errorDiv.style.display = 'block';
            }
        } catch (err) {
            errorDiv.innerText = 'Network error. Please try again.';
            errorDiv.style.display = 'block';
        }
    });
</script>
{% endblock %}
