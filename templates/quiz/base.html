<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QuizzyPop{% endblock %}</title>
    <style>
        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #0f3460;
            --highlight: #e94560;
            --text: #f5f5f5;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary);
            color: var(--text);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: radial-gradient(circle at top right, rgba(15, 52, 96, 0.6), rgba(26, 26, 46, 0.2));
        }

        a { color: var(--highlight); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .btn {
            background-color: var(--highlight);
            color: var(--text);
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
            display: inline-block;
        }
        .btn:hover {
            background-color: #d03a52;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(233, 69, 96, 0.6);
            text-decoration: none;
        }

        .card {
            background-color: var(--secondary);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .error-msg {
            color: var(--highlight);
            background: rgba(233,69,96,0.12);
            border-radius: 6px;
            padding: 0.6rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
